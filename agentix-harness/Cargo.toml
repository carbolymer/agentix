[package]
name = "agentix-harness"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "General-purpose async agent loop harness with tool-call budget enforcement and stagnation detection"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
