[package]
name = "agentix-llama"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "LlamaCpp inference backend for agentix"

build = "build.rs"

[lints]
workspace = true

[features]
cuda = ["llama-cpp-2/cuda"]

[dependencies]
agentix-infer = { path = "../agentix-infer" }
llama-cpp-2 = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
agentix-infer = { path = "../agentix-infer" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
