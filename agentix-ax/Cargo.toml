[package]
name = "agentix-ax"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "General-purpose code development agent CLI"

[[bin]]
name = "ax"
path = "src/main.rs"

[dependencies]
agentix-harness = { path = "../agentix-harness" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
ratatui = "0.29"
crossterm = "0.28"
