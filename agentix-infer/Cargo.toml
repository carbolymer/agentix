[package]
name = "agentix-infer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "In-process inference library for agentix (GGUF via llama.cpp, safetensors via Candle)"

[features]
default = ["llamacpp"]
llamacpp = ["llama-cpp-2"]
candle = ["candle-core", "candle-nn", "candle-transformers"]
cuda = ["llamacpp", "llama-cpp-2/cuda"]

[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hf-hub = "0.3"
ureq = "2"
dirs = "5"
futures = "0.3"

# Optional: llamacpp feature
llama-cpp-2 = { version = "0.1", optional = true }

# Optional: candle feature
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lints]
workspace = true
